AWSTemplateFormatVersion: "2010-09-09"
Description: PEARL payroll DynamoDB tables.

Parameters:
  ProjectName:
    Type: String
  EnvironmentName:
    Type: String

Resources:
  BatchStatusTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${ProjectName}-${EnvironmentName}-batch-status
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: batchId
          AttributeType: S
      KeySchema:
        - AttributeName: batchId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  ParticipantStatusTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${ProjectName}-${EnvironmentName}-participant-status
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: participantId
          AttributeType: S
      KeySchema:
        - AttributeName: participantId
          KeyType: HASH

  S3TriggerIdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${ProjectName}-${EnvironmentName}-s3-trigger-idempotency
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: idempotencyKey
          AttributeType: S
      KeySchema:
        - AttributeName: idempotencyKey
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

Outputs:
  BatchStatusTableName:
    Value: !Ref BatchStatusTable
  ParticipantStatusTableName:
    Value: !Ref ParticipantStatusTable
  S3TriggerIdempotencyTableName:
    Value: !Ref S3TriggerIdempotencyTable
  S3TriggerIdempotencyTableArn:
    Value: !GetAtt S3TriggerIdempotencyTable.Arn
