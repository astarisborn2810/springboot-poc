AWSTemplateFormatVersion: "2010-09-09"
Description: PEARL payroll outbound S3 object-created notifications to SQS.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - qa
      - uat
      - prod
    Description: Deployment environment for PEARL payroll event resources.

  OutboundBucketName:
    Type: String
    Description: Existing outbound S3 bucket name, for example payroll-outbound-dev.
    MinLength: 3

  OutboundBucketArn:
    Type: String
    Description: Existing outbound S3 bucket ARN.
    AllowedPattern: "^arn:[a-zA-Z0-9-]+:s3:::.+$"

  OutboundQueueArn:
    Type: String
    Description: Existing outbound trigger SQS queue ARN.
    AllowedPattern: "^arn:[a-zA-Z0-9-]+:sqs:.+:.+:.+$"

  OutboundQueueUrl:
    Type: String
    Description: Existing outbound trigger SQS queue URL.
    MinLength: 1

Resources:
  OutboundQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref OutboundQueueUrl
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowS3OutboundBucketSendMessage
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action:
              - sqs:SendMessage
            Resource: !Ref OutboundQueueArn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref OutboundBucketArn
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  S3NotificationCustomResourceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub pearl-payroll-s3-notification-role-${Environment}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: manage-outbound-bucket-notification
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManageOutboundBucketNotification
                Effect: Allow
                Action:
                  - s3:GetBucketNotification
                  - s3:PutBucketNotification
                Resource: !Ref OutboundBucketArn
      Tags:
        - Key: Project
          Value: PAYROLL
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  S3NotificationCustomResourceFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub pearl-payroll-s3-notification-${Environment}
      Description: Manages PEARL outbound S3 bucket notifications for an existing bucket.
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt S3NotificationCustomResourceRole.Arn
      Timeout: 60
      MemorySize: 128
      Code:
        ZipFile: |
          import json
          import time
          import urllib.request
          import boto3
          from botocore.exceptions import ClientError

          s3 = boto3.client("s3")

          def send_response(event, context, status, data, reason=None, physical_id=None):
              body = {
                  "Status": status,
                  "Reason": reason or f"See CloudWatch log stream: {context.log_stream_name}",
                  "PhysicalResourceId": physical_id or context.log_stream_name,
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "NoEcho": False,
                  "Data": data,
              }
              encoded = json.dumps(body).encode("utf-8")
              request = urllib.request.Request(event["ResponseURL"], data=encoded, method="PUT")
              request.add_header("content-type", "")
              request.add_header("content-length", str(len(encoded)))
              urllib.request.urlopen(request, timeout=10)

          def clean_config(config, queue_configurations):
              next_config = {}
              for key in ("TopicConfigurations", "LambdaFunctionConfigurations", "EventBridgeConfiguration"):
                  if key in config:
                      next_config[key] = config[key]
              if queue_configurations:
                  next_config["QueueConfigurations"] = queue_configurations
              return next_config

          def put_notification_with_retry(bucket_name, notification_config):
              for attempt in range(1, 7):
                  try:
                      s3.put_bucket_notification_configuration(
                          Bucket=bucket_name,
                          NotificationConfiguration=notification_config,
                      )
                      return
                  except ClientError:
                      if attempt == 6:
                          raise
                      time.sleep(min(2 ** attempt, 20))

          def remove_notification(bucket_name, notification_id):
              try:
                  config = s3.get_bucket_notification_configuration(Bucket=bucket_name)
              except ClientError as exc:
                  if exc.response.get("Error", {}).get("Code") == "NoSuchBucket":
                      return
                  raise
              retained_queues = [
                  item for item in config.get("QueueConfigurations", [])
                  if item.get("Id") != notification_id
              ]
              put_notification_with_retry(bucket_name, clean_config(config, retained_queues))

          def apply_notification(bucket_name, queue_arn, notification_id):
              config = s3.get_bucket_notification_configuration(Bucket=bucket_name)
              retained_queues = [
                  item for item in config.get("QueueConfigurations", [])
                  if item.get("Id") != notification_id
              ]
              retained_queues.append({
                  "Id": notification_id,
                  "QueueArn": queue_arn,
                  "Events": ["s3:ObjectCreated:Put"],
                  "Filter": {
                      "Key": {
                          "FilterRules": [
                              {"Name": "prefix", "Value": "outbound/"}
                          ]
                      }
                  }
              })
              put_notification_with_retry(bucket_name, clean_config(config, retained_queues))

          def handler(event, context):
              props = event["ResourceProperties"]
              bucket_name = props["BucketName"]
              queue_arn = props["QueueArn"]
              notification_id = props["NotificationId"]
              physical_id = f"{bucket_name}/{notification_id}"

              try:
                  if event["RequestType"] in ("Create", "Update"):
                      old_props = event.get("OldResourceProperties", {})
                      old_bucket = old_props.get("BucketName")
                      old_notification_id = old_props.get("NotificationId")
                      if old_bucket and (old_bucket != bucket_name or old_notification_id != notification_id):
                          remove_notification(old_bucket, old_notification_id)
                      apply_notification(bucket_name, queue_arn, notification_id)
                  elif event["RequestType"] == "Delete":
                      remove_notification(bucket_name, notification_id)

                  send_response(event, context, "SUCCESS", {
                      "BucketName": bucket_name,
                      "QueueArn": queue_arn,
                      "NotificationId": notification_id,
                  }, physical_id=physical_id)
              except Exception as exc:
                  send_response(event, context, "FAILED", {}, reason=str(exc), physical_id=physical_id)
      Tags:
        - Key: Project
          Value: PAYROLL
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  OutboundBucketNotification:
    Type: Custom::S3BucketNotification
    DependsOn:
      - OutboundQueuePolicy
    Properties:
      ServiceToken: !GetAtt S3NotificationCustomResourceFunction.Arn
      BucketName: !Ref OutboundBucketName
      BucketArn: !Ref OutboundBucketArn
      QueueArn: !Ref OutboundQueueArn
      QueueUrl: !Ref OutboundQueueUrl
      NotificationId: !Sub pearl-payroll-outbound-to-sqs-${Environment}

Outputs:
  NotificationId:
    Description: S3 notification configuration id managed by this stack.
    Value: !Sub pearl-payroll-outbound-to-sqs-${Environment}

  OutboundBucketName:
    Description: Existing outbound bucket receiving notification configuration.
    Value: !Ref OutboundBucketName

  OutboundQueueArn:
    Description: Existing outbound trigger queue destination ARN.
    Value: !Ref OutboundQueueArn
