AWSTemplateFormatVersion: '2010-09-09'

Description: Payroll S3 Buckets for inbound and outbound payroll processing.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - qa
      - uat
      - prod

Resources:
  PayrollInboundBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub payroll-inbound-${Environment}
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: PAYROLL
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  PayrollOutboundBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub payroll-outbound-${Environment}
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: PAYROLL
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  InboundBucketName:
    Value: !Ref PayrollInboundBucket

  OutboundBucketName:
    Value: !Ref PayrollOutboundBucket

  InboundBucketArn:
    Value: !GetAtt PayrollInboundBucket.Arn

  OutboundBucketArn:
    Value: !GetAtt PayrollOutboundBucket.Arn