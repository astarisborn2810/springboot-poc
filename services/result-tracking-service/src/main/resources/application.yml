spring:
  application:
    name: result-tracking-service
  profiles:
    default: local

server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}

pearl:
  aws:
    region: ${AWS_REGION:us-east-1}
    endpoint-override: ${LOCALSTACK_ENDPOINT:http://localhost:4566}
  tables:
    batch-status: pearl-batch-status-local
  state-machines:
    downstream: pearl-payroll-downstream-local
